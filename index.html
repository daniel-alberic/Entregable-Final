<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Monda:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Inicio</title>

    <link rel="icon" type="image/svg+xml" href="img/nova_isotipo_negro.svg" />

    <link rel="stylesheet" href="CSS/styles.css" />

    <!-- JS -->
    <script src="js/WE_MC_03_jquery.js"></script>
  </head>
  <body>
    <header>
      <nav class="menu">
        <!-- 1. Bloque del Logo -->
        <div class="menu__logo">
          <a href="index.html" class="menu__marca">
            <img src="img/nova_isotipo_blanco.svg" alt="Logo Nova" />
            <span class="logo__nombre">N&Oslash;VA</span>
          </a>
        </div>

        <!-- 2. Botón Hamburguesa (para responsive en móvil) -->
        <a
          href="#"
          class="menu__btn-menu"
          id="btn-menu"
          aria-label="Abrir menú"
        >
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 6h18M3 12h18M3 18h18"
              stroke="currentColor"
              stroke-width="2.5"
              fill="none"
              stroke-linecap="round"
            />
          </svg>
        </a>

        <!-- 3. Bloque de Enlaces de Navegación -->
        <div class="menu__enlaces" id="enlaces">
          <a href="index.html">Inicio</a>
          <a href="sebastian.html">Hombre</a>
          <a href="Marcelo.html">Mujer</a>
          <a href="Adel.html">Niños</a>
          <a href="fran.html">Contacto</a>
          <a href="#">Login</a>
        </div>

        <!-- 4. Buscar y carrito -->
        <div class="menu__acciones">
          <button
            type="button"
            class="menu__buscar"
            id="btn-buscar"
            aria-label="Buscar"
          >
            <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
              <circle
                cx="13"
                cy="13"
                r="9"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              />
              <path
                d="M20 20 L29 29"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              />
            </svg>
          </button>

          <input
            type="search"
            class="menu__input-buscar"
            id="input-buscar"
            placeholder="Buscar productos"
            aria-label="Buscar productos"
          />

          <a href="#" class="menu__carrito"
            >Carrito (<span id="carrito-cantidad">0</span>)</a
          >
        </div>
      </nav>
    </header>

    <!-- TARJETAS -->
    <main>
      <section class="look">
        <div class="look__encabezado">
          <h2 class="look__titulo">COMPRA EL LOOK</h2>
          <a href="#" class="look__ver-todo">Ver todo</a>
        </div>


        <div class="look__lista">
          <div class="look__item">
            <img src="img/modelo-1.jpg" alt="Look deportivo en tonos oscuros">
            <span class="look__etiqueta">4 artículos</span>
          </div>

          <div class="look__item">
            <img src="img/modelo-2.jpg" alt="Look deportivo en tonos oscuros">
            <span class="look__etiqueta">4 artículos</span>
          </div>

          <div class="look__item">
            <img src="img/modelo-3.jpg" alt="Look deportivo en tonos oscuros">
            <span class="look__etiqueta">4 artículos</span>
          </div>
        </div>
      </section>

              <!-- BANNER -->
      <section class="banner">
        <img src="img/grupo-deportistas.avif" class="banner__imagen" alt="">

        <div class="banner__contenido">
          <h2 class="banner__titulo">MOMENTOS PARA EJERCITARSE</h2>
          <p class="banner__texto">Encuentra tus looks favoritos para este verano.</p>
          <a href="#" class="banner__boton">COMPRAR AHORA</a>
        </div>
      </section>
    </main>

    <!-- JS -->

    <script src="js/WE_MC_02_headroom.min.js"></script>
    <script src="js/WE_MC_04_menu-flex.js"></script>

    <script>
      $(function () {
        $("#btn-buscar").on("click", function () {
          $("#input-buscar").toggleClass("activo").focus();
        });

            $("#btn-menu").on("click", function (e) {
      e.preventDefault();
      $("#enlaces").toggleClass("abierto");
    });
  });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Monda:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Inicio</title>

    <link rel="icon" type="image/svg+xml" href="img/nova_isotipo_negro.svg" />

    <link rel="stylesheet" href="CSS/fran.css" />

    <!-- JS -->
    <script src="js/WE_MC_03_jquery.js"></script>
  </head>
  <body>
    <header>
      <nav class="menu">
        <!-- 1. Bloque del Logo -->
        <div class="menu__logo">
          <a href="index.html" class="menu__marca">
            <img src="img/nova_isotipo_blanco.svg" alt="Logo Nova" />
            <span class="logo__nombre">N&Oslash;VA</span>
          </a>
        </div>

        <!-- 2. Botón Hamburguesa (para responsive en móvil) -->
        <a href="#" class="menu__btn-menu" id="btn-menu">
          <i class="fa-solid fa-bars"></i>
        </a>

        <!-- 3. Bloque de Enlaces de Navegación -->
        <div class="menu__enlaces" id="enlaces">
          <a href="index.html">Inicio</a>
          <a href="sebastian.html">Hombre</a>
          <a href="Marcelo.html">Mujer</a>
          <a href="Adel.html">Niños</a>
          <a href="fran.html">Contacto</a>
          <a href="#">Login</a>
        </div>

        <!-- 4. Buscar y carrito -->
        <div class="menu__acciones">
          <button
            type="button"
            class="menu__buscar"
            id="btn-buscar"
            aria-label="Buscar"
          >
            <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
              <circle
                cx="13"
                cy="13"
                r="9"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              />
              <path
                d="M20 20 L29 29"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
              />
            </svg>
          </button>

          <input
            type="search"
            class="menu__input-buscar"
            id="input-buscar"
            placeholder="Buscar productos"
            aria-label="Buscar productos"
          />

          <a href="#" class="menu__carrito"
            >Carrito (<span id="carrito-cantidad">0</span>)</a
          >
        </div>
      </nav>
    </header>

    <!-- JS -->

    <script src="js/WE_MC_02_headroom.min.js"></script>
    <script src="js/WE_MC_04_menu-flex.js"></script>

    <script>
      $(function () {
        $("#btn-buscar").on("click", function () {
          $("#input-buscar").toggleClass("activo").focus();
        });
      });
    </script>
       <div class="contact-container">
        <!-- Columna Izquierda: Información -->
        <div class="contact-info">
            <h2 class="info-title">Información de contacto</h2>
            <ul class="info-list">
                <li><i class="fas fa-map-marker-alt"></i> Dirección de la empresa, 123</li>
                <li><i class="fas fa-envelope"></i> correo@ejemplo.com</li>
                <li><i class="fas fa-phone"></i> +123 456 789</li>
            </ul>

            <div class="social-section">
                <p>Síguenos en redes sociales:</p>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>

            <div class="circle-decoration"></div>
        </div>

        <!-- Columna Derecha: Formulario -->
        <div class="contact-form">
            <h2 class="form-title">Envíanos un mensaje</h2>
            <form action="#" method="POST">
                
                <fieldset class="input-group">
                    <legend>Nombre completo</legend>
                    <input type="text" name="nombre" required>
                </fieldset>

                <fieldset class="input-group">
                    <legend>Correo electrónico</legend>
                    <input type="email" name="email" required>
                </fieldset>

                <fieldset class="input-group">
                    <legend>Teléfono</legend>
                    <input type="tel" name="telefono">
                </fieldset>

                <fieldset class="input-group textarea-group">
                    <legend>Mensaje</legend>
                    <textarea name="mensaje" required></textarea>
                </fieldset>

                <button type="submit" class="btn-send">Enviar</button>
            </form>
        </div>
    </div>


  </body>
</html>
